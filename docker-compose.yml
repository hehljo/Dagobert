version: '3.8'

services:
  dagobert:
    image: ghcr.io/hehljo/dagobert:latest
    # Alternativ lokal aus dem Quellcode bauen:
    # build: .
    container_name: dagobert
    restart: unless-stopped
    ports:
      - 5052:5052
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=5052
      - DATA_DIR=/app/data
